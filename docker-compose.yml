name: proofmerge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proofmerge
      POSTGRES_USER: proofmerge
      POSTGRES_PASSWORD: proofmerge-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofmerge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.3
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proofmerge
      MINIO_ROOT_PASSWORD: proofmerge-local-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  create-bucket:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 proofmerge proofmerge-local-secret;
      do sleep 1; done; mc mb --ignore-existing local/proofmerge-artifacts"

  api:
    build: .
    environment: &backend-environment
      PROOFMERGE_ENVIRONMENT: development
      PROOFMERGE_DATABASE_URL: postgresql+asyncpg://proofmerge:proofmerge-local@postgres:5432/proofmerge
      PROOFMERGE_QUEUE_BACKEND: kafka
      PROOFMERGE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      PROOFMERGE_QDRANT_URL: http://qdrant:6333
      PROOFMERGE_S3_ENDPOINT_URL: http://minio:9000
      PROOFMERGE_S3_BUCKET: proofmerge-artifacts
      PROOFMERGE_S3_ACCESS_KEY: proofmerge
      PROOFMERGE_S3_SECRET_KEY: proofmerge-local-secret
      PROOFMERGE_CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "proofmerge.worker"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
