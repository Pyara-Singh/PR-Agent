{{- $root := . -}}
{{- range $component := list "api" "worker" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $component }}
  labels:
    app.kubernetes.io/name: proofmerge
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ index $root.Values.replicaCount $component }}
  selector:
    matchLabels:
      app.kubernetes.io/name: proofmerge
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proofmerge
        app.kubernetes.io/component: {{ $component }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component }}
          image: {{ if eq $component "web" }}{{ $root.Values.image.web }}{{ else }}{{ $root.Values.image.backend }}{{ end }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if eq $component "worker" }}
          command: ["python", "-m", "proofmerge.worker"]
          {{- end }}
          {{- if ne $component "web" }}
          envFrom:
            - configMapRef:
                name: {{ $root.Release.Name }}-config
            - secretRef:
                name: {{ $root.Release.Name }}-secrets
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          {{- if ne $component "worker" }}
          ports:
            - containerPort: {{ if eq $component "web" }}{{ $root.Values.service.webPort }}{{ else }}{{ $root.Values.service.apiPort }}{{ end }}
          {{- end }}
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
---
{{- end }}

